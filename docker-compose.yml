services:
  # PostgreSQL database service
  db:
    image: postgres:15
    container_name: educonnect_db
    environment:
      POSTGRES_USER: edu_user
      POSTGRES_PASSWORD: edu_pass
      POSTGRES_DB: edu_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U edu_user" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django web application service
  web:

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build: .
    container_name: educonnect_web
    command: bash -c "./start.sh"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_HOST=db
      - DATABASE_NAME=edu_db
      - DATABASE_USER=edu_user
      - DATABASE_PASSWORD=edu_pass
      - DATABASE_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
